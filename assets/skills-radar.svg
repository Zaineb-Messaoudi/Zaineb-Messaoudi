      <stop offset="0" stop-color="#FADADD" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#E9C8F4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#B88CC6" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="412" height="452" rx="20" fill="#1A1020"/>
  <text x="24" y="32" font-family="Verdana, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#B88CC6">04 — CORE COMPETENCIES</text>

