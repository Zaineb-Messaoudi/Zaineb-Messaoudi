<svg xmlns="http://www.w3.org/2000/svg" width="420" height="460" viewBox="0 0 420 460" role="img" aria-labelledby="radarTitle">
  <title id="radarTitle">Core competencies: full-stack, applied ML, accessibility, DevOps, data and analytics, systems design</title>
  <defs>
