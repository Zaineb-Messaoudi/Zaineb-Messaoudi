  <polygon points="210,183.3 250.44,206.65 250.44,253.35 210,276.7 169.56,253.35 169.56,206.65" fill="none" stroke="#3A1F3D" stroke-width="1"/>
  <polygon points="210,136.7 290.8,183.35 290.8,276.65 210,323.3 129.2,276.65 129.2,183.35" fill="none" stroke="#3A1F3D" stroke-width="1"/>
  <polygon points="210,90 331.24,160 331.24,300 210,370 88.76,300 88.76,160" fill="none" stroke="#3A1F3D" stroke-width="1.25"/>

  <!-- axis lines -->
  <line x1="210" y1="230" x2="210" y2="90" stroke="#3A1F3D" stroke-width="1"/>
  <line x1="210" y1="230" x2="331.24" y2="160" stroke="#3A1F3D" stroke-width="1"/>
  <line x1="210" y1="230" x2="331.24" y2="300" stroke="#3A1F3D" stroke-width="1"/>
  <line x1="210" y1="230" x2="210" y2="370" stroke="#3A1F3D" stroke-width="1"/>
  <line x1="210" y1="230" x2="88.76" y2="300" stroke="#3A1F3D" stroke-width="1"/>
  <line x1="210" y1="230" x2="88.76" y2="160" stroke="#3A1F3D" stroke-width="1"/>

  <!-- value polygon -->
  <polygon points="210,97 313.05,170.5 319.1,293 210,328 113,286 115.43,175.4"
           fill="url(#radarFill)" stroke="#F7EAF2" stroke-width="1.5"/>

  <!-- value dots -->
  <circle cx="210" cy="97" r="3.5" fill="#F7EAF2"/>
  <circle cx="313.05" cy="170.5" r="3.5" fill="#F7EAF2"/>
  <circle cx="319.1" cy="293" r="3.5" fill="#F7EAF2"/>
  <circle cx="210" cy="328" r="3.5" fill="#F7EAF2"/>
  <circle cx="113" cy="286" r="3.5" fill="#F7EAF2"/>
  <circle cx="115.43" cy="175.4" r="3.5" fill="#F7EAF2"/>

