  <text x="210" y="72" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#E9C8F4">FULL-STACK</text>
  <text x="357" y="140" text-anchor="start" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#E9C8F4">APPLIED ML</text>
  <text x="357" y="318" text-anchor="start" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#E9C8F4">ACCESSIBILITY</text>
  <text x="210" y="397" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#E9C8F4">DEVOPS / CLOUD</text>
  <text x="63" y="318" text-anchor="end" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#E9C8F4">DATA &amp; ANALYTICS</text>
  <text x="63" y="140" text-anchor="end" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#E9C8F4">SYSTEMS DESIGN</text>

  <text x="210" y="445" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="9" font-style="italic" fill="#6B4A70">Self-assessed, weighted by shipped-project evidence</text>
