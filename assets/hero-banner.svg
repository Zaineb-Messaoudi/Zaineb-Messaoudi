<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffafd"/>
      <stop offset="52%" stop-color="#fdeef5"/>
      <stop offset="100%" stop-color="#f6e6f2"/>
    </linearGradient>
    <radialGradient id="glowRose" cx="14%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#f0a8c4" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#f0a8c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="92%" cy="12%" r="40%">
      <stop offset="0%" stop-color="#d28ad6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d28ad6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLower" cx="55%" cy="115%" r="45%">
      <stop offset="0%" stop-color="#e47aa8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e47aa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d1b28"/>
      <stop offset="55%" stop-color="#e47aa8"/>
      <stop offset="100%" stop-color="#c487d8"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e47aa8"/>
      <stop offset="55%" stop-color="#c487d8"/>
      <stop offset="100%" stop-color="#f0a8c4" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e47aa8"/>
      <stop offset="100%" stop-color="#c487d8"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#6e5162" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridMask" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </radialGradient>
    <mask id="gridFade">
      <rect width="1200" height="420" fill="url(#gridMask)"/>
    </mask>
  </defs>

  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)" mask="url(#gridFade)"/>
  <rect width="1200" height="420" fill="url(#glowRose)"/>
  <rect width="1200" height="420" fill="url(#glowIndigo)"/>
  <rect width="1200" height="420" fill="url(#glowLower)"/>

  <!-- faint orbit ring, echoing hero-visual::before -->
  <ellipse cx="985" cy="150" rx="150" ry="150" fill="none" stroke="#e47aa8" stroke-opacity="0.22" stroke-width="1" transform="rotate(-18 985 150)"/>
  <ellipse cx="985" cy="150" rx="112" ry="112" fill="none" stroke="#c487d8" stroke-opacity="0.24" stroke-width="1" transform="rotate(24 985 150)"/>

  <!-- eyebrow pill -->
  <rect x="80" y="72" width="330" height="34" rx="17" fill="#f0a8c4" fill-opacity="0.14" stroke="#e47aa8" stroke-opacity="0.3"/>
  <text x="97" y="94" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="12.5" letter-spacing="2.2" fill="#6f4c5f" font-weight="700">SOFTWARE ENGINEER · FULL-STACK / AI</text>

  <!-- name -->
  <text x="76" y="216" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="700" letter-spacing="-3" fill="url(#nameGrad)">ZAINEB</text>
  <text x="76" y="304" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="700" letter-spacing="-3" fill="#2d1b28">MESSAOUDI</text>

  <!-- stroke rule -->
  <rect x="80" y="330" width="128" height="5" rx="3" fill="url(#ruleGrad)" transform="rotate(-1.4 80 330)"/>

  <!-- tag chips -->
  <g font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="11.5" letter-spacing="1.4" font-weight="700" fill="#6f4c5f">
    <rect x="80" y="356" width="94" height="30" rx="15" fill="#ffffff" fill-opacity="0.55" stroke="#b88096" stroke-opacity="0.18"/>
    <text x="97" y="375">FINTECH</text>
    <rect x="186" y="356" width="122" height="30" rx="15" fill="#ffffff" fill-opacity="0.55" stroke="#b88096" stroke-opacity="0.18"/>
    <text x="203" y="375">HEALTHCARE</text>
    <rect x="320" y="356" width="86" height="30" rx="15" fill="#ffffff" fill-opacity="0.55" stroke="#b88096" stroke-opacity="0.18"/>
    <text x="337" y="375">EDTECH</text>
    <rect x="418" y="356" width="90" height="30" rx="15" fill="#ffffff" fill-opacity="0.55" stroke="#b88096" stroke-opacity="0.18"/>
    <text x="435" y="375">AI / ML</text>
  </g>

  <!-- monogram badge -->
  <g transform="translate(1010,240)">
    <rect x="-56" y="-56" width="112" height="112" rx="26" fill="url(#badgeGrad)" transform="rotate(-8)"/>
    <text x="0" y="16" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="700" fill="#fff6fb" text-anchor="middle" letter-spacing="-1">ZM</text>
  </g>

  <!-- vertical location/year label -->
  <text x="1140" y="360" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="11" letter-spacing="2.6" fill="#8f6a7f" font-weight="700" text-anchor="end">TUNIS, TUNISIA · 2026</text>
</svg>
