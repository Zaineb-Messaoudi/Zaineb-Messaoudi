<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e47aa8"/>
      <stop offset="100%" stop-color="#c487d8"/>
    </linearGradient>
  </defs>

  <rect x="18" y="18" width="204" height="204" rx="46" fill="url(#markGrad)" transform="rotate(-6 120 120)"/>
  <rect x="18" y="18" width="204" height="204" rx="46" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1" transform="rotate(-6 120 120)"/>

  <!-- geometric Z / M linework, interlocked -->
  <g fill="none" stroke="#fff6fb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Z -->
    <path d="M74 80 L134 80 L74 158 L134 158"/>
    <!-- M, offset to interlock with the Z's diagonal -->
    <path d="M110 158 L110 96 L136 130 L162 96 L162 158"/>
  </g>

  <circle cx="120" cy="120" r="94" fill="none" stroke="#fff6fb" stroke-opacity="0.28" stroke-width="1"/>
